<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" role="img" aria-labelledby="title desc">
  <title id="title">How the funding-rate bot runs a position</title>
  <desc id="desc">Five steps in a loop. 1. Scan: every 15 minutes, look for a funding rate of 0.25 to 3 percent per 8 hours. 2. Approve: you type y or n in the terminal, with a 5-minute timeout; n or no answer goes back to scanning. 3. Enter: short the perpetual, buy the matching spot, and place a stop order at plus 15 percent. 4. Hold: funding is paid every 8 hours, and the bot checks the position every 5 minutes. 5. Exit: close the short and sell the spot when an exit rule fires, then scan again.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .ink { fill: #1f2328; }
    .mut { fill: #59636e; }
    .line { fill: none; stroke: #8c959f; stroke-width: 1.5; }
    .head { fill: #8c959f; }
    .step { fill: #1a7f37; }
    .onstep { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #161b22; stroke: #30363d; }
      .ink { fill: #e6edf3; }
      .mut { fill: #9198a1; }
      .line { stroke: #7d8590; }
      .head { fill: #7d8590; }
      .step { fill: #238636; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path class="head" d="M0,1 L10,5 L0,9 z"/>
    </marker>
  </defs>

  <!-- Loops back to scanning -->
  <path class="line" d="M286,51.5 V30.5 H92.5 V50" marker-end="url(#arrow)"/>
  <text x="189" y="24" text-anchor="middle" font-size="12.5" class="mut">n or no answer: scan again</text>
  <path class="line" d="M868,176.5 V200.5 H92.5 V178" marker-end="url(#arrow)"/>
  <text x="480" y="221" text-anchor="middle" font-size="12.5" class="mut">then scan again</text>

  <!-- 1 Scan -->
  <rect class="panel" x="9.5" y="52.5" width="166" height="124" rx="12"/>
  <circle class="step" cx="36" cy="81" r="12"/>
  <text x="36" y="85.5" text-anchor="middle" font-size="12.5" font-weight="700" class="onstep">1</text>
  <text x="56" y="87" font-size="16" font-weight="600" class="ink">Scan</text>
  <text x="24" y="116" font-size="13.5" class="ink">Every 15 minutes,</text>
  <text x="24" y="135" font-size="13.5" class="ink">looks for a rate of</text>
  <text x="24" y="154" font-size="13.5" class="ink">0.25–3% per 8 hours</text>
  <path class="line" d="M180,114.5 H199" marker-end="url(#arrow)"/>

  <!-- 2 Approve -->
  <rect class="panel" x="203.5" y="52.5" width="166" height="124" rx="12"/>
  <circle class="step" cx="230" cy="81" r="12"/>
  <text x="230" y="85.5" text-anchor="middle" font-size="12.5" font-weight="700" class="onstep">2</text>
  <text x="250" y="87" font-size="16" font-weight="600" class="ink">Approve</text>
  <text x="218" y="116" font-size="13.5" class="ink">You type y or n</text>
  <text x="218" y="135" font-size="13.5" class="ink">in the terminal</text>
  <text x="218" y="154" font-size="13.5" class="mut">5-minute timeout</text>
  <path class="line" d="M374,114.5 H393" marker-end="url(#arrow)"/>
  <text x="383" y="106" text-anchor="middle" font-size="13" class="mut">y</text>

  <!-- 3 Enter -->
  <rect class="panel" x="397.5" y="52.5" width="166" height="124" rx="12"/>
  <circle class="step" cx="424" cy="81" r="12"/>
  <text x="424" y="85.5" text-anchor="middle" font-size="12.5" font-weight="700" class="onstep">3</text>
  <text x="444" y="87" font-size="16" font-weight="600" class="ink">Enter</text>
  <text x="412" y="116" font-size="13.5" class="ink">Short perpetual,</text>
  <text x="412" y="135" font-size="13.5" class="ink">buy matching spot,</text>
  <text x="412" y="154" font-size="13.5" class="ink">stop order at +15%</text>
  <path class="line" d="M568,114.5 H587" marker-end="url(#arrow)"/>

  <!-- 4 Hold -->
  <rect class="panel" x="591.5" y="52.5" width="166" height="124" rx="12"/>
  <circle class="step" cx="618" cy="81" r="12"/>
  <text x="618" y="85.5" text-anchor="middle" font-size="12.5" font-weight="700" class="onstep">4</text>
  <text x="638" y="87" font-size="16" font-weight="600" class="ink">Hold</text>
  <text x="606" y="116" font-size="13.5" class="ink">Funding paid every</text>
  <text x="606" y="135" font-size="13.5" class="ink">8 hours; checks</text>
  <text x="606" y="154" font-size="13.5" class="ink">every 5 minutes</text>
  <path class="line" d="M762,114.5 H781" marker-end="url(#arrow)"/>

  <!-- 5 Exit -->
  <rect class="panel" x="785.5" y="52.5" width="166" height="124" rx="12"/>
  <circle class="step" cx="812" cy="81" r="12"/>
  <text x="812" y="85.5" text-anchor="middle" font-size="12.5" font-weight="700" class="onstep">5</text>
  <text x="832" y="87" font-size="16" font-weight="600" class="ink">Exit</text>
  <text x="800" y="116" font-size="13.5" class="ink">Close the short,</text>
  <text x="800" y="135" font-size="13.5" class="ink">sell the spot when</text>
  <text x="800" y="154" font-size="13.5" class="ink">an exit rule fires</text>
</svg>
